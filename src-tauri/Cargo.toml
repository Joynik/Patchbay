[package]
name = "patchbay"
version = "0.3.1"
edition = "2024"

[package.metadata.cargo-machete]
ignored = []

[dependencies]
jsonc-parser = { version = "0.34", features = ["cst", "serde"] }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tauri = { version = "2.12.7", features = [] }
tauri-plugin-single-instance = "2.5.5"
tempfile = "3.27.0"
toml_edit = { version = "0.25.20", features = ["serde"] }
url = "2.5.9"
uuid = { version = "1.29.3", features = ["v4"] }

yaml-edit = { version = "0.3.6", default-features = false }

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }
