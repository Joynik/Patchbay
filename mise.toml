[settings]
task.run_auto_install = false
task.quiet = true

[env]
_.file = ".env"
PROJECT_JAVASCRIPT_DIRECTORY = "{{ env.PROJECT_JAVASCRIPT_DIRECTORY | default(value=config_root ~ '/' ~ vars.javascript_directory) }}"
PROJECT_RUST_DIRECTORY = "{{ env.PROJECT_RUST_DIRECTORY | default(value=config_root ~ '/' ~ vars.rust_directory) }}"
JAVASCRIPT_BUILD_SCRIPT = "{{ env.JAVASCRIPT_BUILD_SCRIPT | default(value=vars.javascript_build_script) }}"

[vars]
javascript_directory = "."
rust_directory = "src-tauri"
javascript_build_script = "build"

# kitflow:begin task.help
[tasks."help"]
description = "List project tasks and descriptions"
alias = "default"
quiet = true
run = '''
set -eu
mise tasks ls
'''
# kitflow:end task.help

# kitflow:begin task.env:local
[tasks."env:local"]
description = "Create .env from the example without replacing an existing file"
run = '''
set -eu
if [ -e .env ] || [ -L .env ]; then
    echo ".env already exists; edit it manually" >&2
    exit 2
fi
(set -C; cat .env.example > .env)
'''
# kitflow:end task.env:local

# kitflow:begin task.check
[tasks."check"]
description = "Check code, formatting, types and migrations"
run = '''
set -eu
if [ "${kitflow_checked_lint:-0}" != 1 ]; then
    mise run --quiet lint
    kitflow_checked_lint=1
fi
if [ "${kitflow_checked_format_check:-0}" != 1 ]; then
    mise run --quiet format-check
    kitflow_checked_format_check=1
fi
if [ "${kitflow_checked_typecheck:-0}" != 1 ]; then
    mise run --quiet typecheck
    kitflow_checked_typecheck=1
fi
'''
# kitflow:end task.check

# kitflow:begin task.verify
[tasks."verify"]
description = "Run checks, application checks and tests sequentially"
run = '''
set -eu
if [ "${kitflow_verified_check:-0}" != 1 ]; then
    mise run --quiet check
    kitflow_verified_check=1
fi
if [ "${kitflow_verified_test:-0}" != 1 ]; then
    mise run --quiet test
    kitflow_verified_test=1
fi
'''
# kitflow:end task.verify

# kitflow:begin task.lint
[tasks."lint"]
description = "Lint selected project components"
run = '''
set -eu
rumdl check . --output-format concise --quiet
(
cd "${PROJECT_RUST_DIRECTORY:?Set PROJECT_RUST_DIRECTORY in mise.toml}"
cargo clippy --manifest-path Cargo.toml --workspace --all-targets --quiet --message-format short -- -D warnings
)
(
cd "${PROJECT_JAVASCRIPT_DIRECTORY:?Set PROJECT_JAVASCRIPT_DIRECTORY in mise.toml}"
bun lint --no-script --format unix --max-warnings 0 .
)
'''
# kitflow:end task.lint

# kitflow:begin task.check-unused
[tasks."check-unused"]
description = "Find potentially unused code and files"
run = '''
set -eu
(
cd "${PROJECT_JAVASCRIPT_DIRECTORY:?Set PROJECT_JAVASCRIPT_DIRECTORY in mise.toml}"
if [ ! -x node_modules/.bin/knip ]; then
  printf '%s\n' 'Knip is missing. Install the project dependencies first.' >&2
  exit 1
fi
if command -v bun >/dev/null 2>&1; then
  set -- bun node_modules/.bin/knip
else
  set -- node_modules/.bin/knip
fi
"$@" --include files,exports,types --reporter compact --no-progress
)
'''
# kitflow:end task.check-unused

# kitflow:begin task.check-deps
[tasks."check-deps"]
description = "Check declared dependencies"
run = '''
set -eu
(
cd "${PROJECT_JAVASCRIPT_DIRECTORY:?Set PROJECT_JAVASCRIPT_DIRECTORY in mise.toml}"
if [ ! -x node_modules/.bin/knip ]; then
  printf '%s\n' 'Knip is missing. Install the project dependencies first.' >&2
  exit 1
fi
if command -v bun >/dev/null 2>&1; then
  set -- bun node_modules/.bin/knip
else
  set -- node_modules/.bin/knip
fi
"$@" --dependencies --reporter compact --no-progress
)
(
cd "${PROJECT_RUST_DIRECTORY:?Set PROJECT_RUST_DIRECTORY in mise.toml}"
if [ ! -x target/kitflow-tools/bin/cargo-machete ]; then
  printf '%s\n' 'Cargo Machete is missing. Run mise run install-cargo-machete first.' >&2
  exit 1
fi
status=0
output=$(target/kitflow-tools/bin/cargo-machete --quiet --skip-target-dir .) || status=$?
printf '%s\n' "$output" | awk '
  /^If you believe cargo-machete/ { exit }
  NF
'
(exit "$status")
)
'''
# kitflow:end task.check-deps

# kitflow:begin task.install-cargo-machete
[tasks."install-cargo-machete"]
description = "Install Cargo Machete in the project"
run = '''
set -eu
(
cd "${PROJECT_RUST_DIRECTORY:?Set PROJECT_RUST_DIRECTORY in mise.toml}"
cargo install --locked --quiet --root target/kitflow-tools cargo-machete --version 0.10.1
)
'''
# kitflow:end task.install-cargo-machete

# kitflow:begin task.lint-fix
[tasks."lint-fix"]
description = "Apply supported lint fixes"
run = '''
set -eu
(
cd "${PROJECT_JAVASCRIPT_DIRECTORY:?Set PROJECT_JAVASCRIPT_DIRECTORY in mise.toml}"
bun lint --no-script --format unix --max-warnings 0 --fix .
)
(
cd "${PROJECT_RUST_DIRECTORY:?Set PROJECT_RUST_DIRECTORY in mise.toml}"
cargo clippy --fix --manifest-path Cargo.toml --workspace --all-targets --quiet --message-format short -- -D warnings
)
rumdl check . --fix --output-format concise --quiet
'''
# kitflow:end task.lint-fix

# kitflow:begin task.format
[tasks."format"]
description = "Format selected project components"
run = '''
set -eu
(
cd "${PROJECT_RUST_DIRECTORY:?Set PROJECT_RUST_DIRECTORY in mise.toml}"
cargo fmt --manifest-path Cargo.toml --all --quiet
)
(
cd "${PROJECT_JAVASCRIPT_DIRECTORY:?Set PROJECT_JAVASCRIPT_DIRECTORY in mise.toml}"
bun fmt --no-script --log-level warn .
)
rumdl fmt . --output-format concise --quiet
'''
# kitflow:end task.format

# kitflow:begin task.format-check
[tasks."format-check"]
description = "Check formatting without applying fixes"
run = '''
set -eu
(
cd "${PROJECT_RUST_DIRECTORY:?Set PROJECT_RUST_DIRECTORY in mise.toml}"
cargo fmt --manifest-path Cargo.toml --all --message-format short -- --check
)
(
cd "${PROJECT_JAVASCRIPT_DIRECTORY:?Set PROJECT_JAVASCRIPT_DIRECTORY in mise.toml}"
bun fmt --no-script --list-different .
)
rumdl fmt . --check --output-format concise --quiet
'''
# kitflow:end task.format-check

# kitflow:begin task.typecheck
[tasks."typecheck"]
description = "Check selected project types and native builds"
run = '''
set -eu
(
cd "${PROJECT_RUST_DIRECTORY:?Set PROJECT_RUST_DIRECTORY in mise.toml}"
cargo check --manifest-path Cargo.toml --workspace --all-targets --quiet --message-format short
)
(
cd "${PROJECT_JAVASCRIPT_DIRECTORY:?Set PROJECT_JAVASCRIPT_DIRECTORY in mise.toml}"
bun check --no-script --build --no-pretty
)
'''
# kitflow:end task.typecheck

[tasks."test"]
description = "Run Rust and Playwright UI tests"
run = '''
set -eu
(
cd "${PROJECT_RUST_DIRECTORY:?Set PROJECT_RUST_DIRECTORY in mise.toml}"
cargo test --manifest-path Cargo.toml --workspace --all-targets --quiet --message-format short
)
(
cd "${PROJECT_JAVASCRIPT_DIRECTORY:?Set PROJECT_JAVASCRIPT_DIRECTORY in mise.toml}"
bun x --no-install playwright test
)
'''

# kitflow:begin task.app:build
[tasks."app:build"]
description = "Build the Tauri application"
run = '''
set -eu
(
cd "${PROJECT_JAVASCRIPT_DIRECTORY:?Set PROJECT_JAVASCRIPT_DIRECTORY in mise.toml}"
bunx --no-install tauri build
)
'''
# kitflow:end task.app:build

# kitflow:begin task.frontend:dev
[tasks."frontend:dev"]
description = "Run the frontend development server"
run = '''
set -eu
(
cd "${PROJECT_JAVASCRIPT_DIRECTORY:?Set PROJECT_JAVASCRIPT_DIRECTORY in mise.toml}"
bunx --no-install vite --logLevel info --clearScreen false
)
'''
# kitflow:end task.frontend:dev

# kitflow:begin task.frontend:build
[tasks."frontend:build"]
description = "Frontend build"
run = '''
set -eu
(
cd "${PROJECT_JAVASCRIPT_DIRECTORY:?Set PROJECT_JAVASCRIPT_DIRECTORY in mise.toml}"
bunx --no-install vite build --logLevel warn
)
'''
# kitflow:end task.frontend:build

# kitflow:begin task.start
[tasks."start"]
description = "Start"
run = '''
set -eu
(
cd "${PROJECT_JAVASCRIPT_DIRECTORY:?Set PROJECT_JAVASCRIPT_DIRECTORY in mise.toml}"
bunx --no-install tauri dev
)
'''
# kitflow:end task.start
