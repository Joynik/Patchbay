name: Update Homebrew tap

on:
    workflow_call:
        inputs:
            version:
                required: true
                type: string
        secrets:
            HOMEBREW_TAP_SSH_KEY:
                required: true
    workflow_dispatch:
        inputs:
            version:
                description: Published release tag
                required: true
                type: string

permissions:
    contents: read

concurrency:
    group: patchbay-homebrew
    cancel-in-progress: false

jobs:
    update:
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  repository: Joynik/homebrew-tap
                  ref: main
                  ssh-key: ${{ secrets.HOMEBREW_TAP_SSH_KEY }}
            - name: Update the cask from the latest published release
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  VERSION: ${{ inputs.version }}
              run: |
                  [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
                  gh api "repos/$GH_REPO/releases/latest" > "$RUNNER_TEMP/patchbay-release.json"
                  if [[ "$(jq -er '.tag_name' "$RUNNER_TEMP/patchbay-release.json")" != "$VERSION" ]]; then
                      echo "Skipping $VERSION because it is no longer the latest release."
                      exit 0
                  fi

                  checksum() {
                      jq -er --arg name "Patchbay-$VERSION-macos-$1.zip" '
                          .assets[] | select(.name == $name and .state == "uploaded")
                          | .digest | select(test("^sha256:[0-9a-f]{64}$")) | split(":")[1]
                      ' "$RUNNER_TEMP/patchbay-release.json"
                  }

                  arm=$(checksum arm64)
                  intel=$(checksum x86_64)
                  cat > Casks/patchbay.rb <<CASK
                  cask "patchbay" do
                    arch arm: "arm64", intel: "x86_64"

                    version "$VERSION"
                    sha256 arm: "$arm",
                           intel: "$intel"

                    url "https://github.com/Joynik/Patchbay/releases/download/#{version}/Patchbay-#{version}-macos-#{arch}.zip"
                    name "Patchbay"
                    desc "Manage MCP server configurations across AI agents"
                    homepage "https://github.com/Joynik/Patchbay"

                    livecheck do
                      url :url
                      strategy :github_latest
                    end

                    depends_on :macos

                    app "Patchbay.app"
                  end
                  CASK
                  ruby -c Casks/patchbay.rb
                  git add Casks/patchbay.rb
                  git diff --cached --check
                  if git diff --cached --quiet; then
                      exit 0
                  fi
                  git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "chore(patchbay): update to $VERSION"
                  git pull --rebase origin main
                  git push origin HEAD:main
