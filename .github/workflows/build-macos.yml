name: Build macOS

on:
    push:
        branches: [main]
        tags: ["[0-9]*.[0-9]*.[0-9]*"]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: macos-${{ github.ref }}
    cancel-in-progress: false

jobs:
    build:
        name: Build macOS (${{ matrix.arch }})
        strategy:
            fail-fast: false
            matrix:
                include:
                    - runner: macos-15
                      arch: arm64
                    - runner: macos-15-intel
                      arch: x86_64
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 30

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: "1.4.5"
            - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
              with:
                  install: false
                  cache: false

            - name: Install build dependencies
              run: |
                  rustup toolchain install stable --profile minimal
                  rustup default stable
                  bun install --frozen-lockfile

            - name: Build the macOS app
              run: |
                  mise trust mise.toml
                  mise run app:build

            - name: Package the app
              env:
                  ARCH: ${{ matrix.arch }}
              run: |
                  app="src-tauri/target/release/bundle/macos/Patchbay.app"
                  version=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$app/Contents/Info.plist")
                  test "$(lipo -archs "$app/Contents/MacOS/patchbay")" = "$ARCH"
                  mkdir -p artifacts
                  ditto -c -k --sequesterRsrc --keepParent "$app" "artifacts/Patchbay-$version-macos-$ARCH.zip"

            - name: Upload build artifact
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: patchbay-${{ matrix.arch }}
                  path: artifacts/*.zip
                  if-no-files-found: error
                  compression-level: 0

    release:
        if: github.ref_type == 'tag'
        needs: build
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  pattern: patchbay-*
                  path: release-assets
                  merge-multiple: true
            - name: Publish both macOS builds
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  RELEASE_TAG: ${{ github.ref_name }}
              run: |
                  python3 - <<'PY'
                  import json
                  import os
                  import re
                  import tomllib
                  from pathlib import Path

                  tag = os.environ['RELEASE_TAG']
                  if not re.fullmatch(r'(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', tag):
                      raise SystemExit('Expected a MAJOR.MINOR.PATCH tag')
                  versions = [
                      json.loads(Path('package.json').read_text())['version'],
                      json.loads(Path('src-tauri/tauri.conf.json').read_text())['version'],
                      tomllib.loads(Path('src-tauri/Cargo.toml').read_text())['package']['version'],
                  ]
                  if any(version != tag for version in versions):
                      raise SystemExit('Package versions must match the tag')
                  changelog = Path('CHANGELOG.md').read_text()
                  match = re.search(rf'^## {re.escape(tag)} — \d{{4}}-\d{{2}}-\d{{2}}\n(.+?)(?=^## |\Z)', changelog, re.M | re.S)
                  if not match or not match[1].strip():
                      raise SystemExit('Expected dated release notes in CHANGELOG.md')
                  Path('release-notes.md').write_text(match[1].strip() + '\n')
                  PY
                  cd release-assets
                  arm="Patchbay-$RELEASE_TAG-macos-arm64.zip"
                  intel="Patchbay-$RELEASE_TAG-macos-x86_64.zip"
                  unzip -tq "$arm"
                  unzip -tq "$intel"
                  sha256sum "$arm" "$intel" > SHA256SUMS
                  if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' | grep -qx false; then
                      echo "Release $RELEASE_TAG is already published."
                  else
                      gh release create "$RELEASE_TAG" "$arm" "$intel" SHA256SUMS \
                          --verify-tag --title "Patchbay $RELEASE_TAG" --notes-file ../release-notes.md --latest
                  fi

    homebrew:
        needs: release
        uses: ./.github/workflows/homebrew.yml
        with:
            version: ${{ github.ref_name }}
        secrets:
            HOMEBREW_TAP_SSH_KEY: ${{ secrets.HOMEBREW_TAP_SSH_KEY }}
